[package]
name = "midnite-archive"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "=7.2.2"
regex = "1.12.3"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
which = "8.0"
ytd-rs = "0.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
